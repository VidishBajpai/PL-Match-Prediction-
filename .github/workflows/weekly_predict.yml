name: Weekly Premier League Prediction & Model Sync

on:
  schedule:
    # Runs every Tuesday at 06:00 UTC (after Monday night matchday concludes)
    - cron: '0 6 * * 2'
    # Runs every Friday at 06:00 UTC (fresh update ahead of the weekend fixtures)
    - cron: '0 6 * * 5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual execution'
        required: false
        default: 'Manual trigger from GitHub UI'

permissions:
  contents: write

jobs:
  run-prediction-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn xgboost requests

      - name: Run Production Prediction Pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY || '60e60f6073da4ebf97760ff585ef0432' }}
        run: |
          python scripts/weekly_pipeline.py

      - name: Commit & Push Updated Dataset, Models, and Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dataset/processed_match_dataset.csv saved_models/ reports/latest_gameweek_predictions.md
          if git diff --staged --quiet; then
            echo "No data or model changes to commit."
          else
            git commit -m "chore(cron): automated weekly Premier League predictions & model sync [skip ci]"
            git push
          fi

      - name: Publish Game-Week Predictions to Job Summary
        if: always()
        run: |
          if [ -f reports/latest_gameweek_predictions.md ]; then
            cat reports/latest_gameweek_predictions.md >> $GITHUB_STEP_SUMMARY
          fi
